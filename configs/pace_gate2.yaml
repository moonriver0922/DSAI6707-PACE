# PACE Gate 2 — online evolutionary proof (AG News × Qwen2.5-7B)
# Aligned with PACE_METHOD_SPEC / pace_gate1 survivor params and plan §Gate 2.
# Treatment = survivor only: B0 point-estimate NSGA truncate vs PACE bounded survive.
# Evaluation = Paired Racing for all methods. DICE untouched.

seed_split: 6707
model_id: Qwen/Qwen2.5-7B-Instruct
dtype: bfloat16
max_new_tokens: 8
do_sample: false
batch_size: 8

n_search: 160
n_test: 200
init_common: 8

# Plan Gate 2 search shape
population_size: 8
n_generations: 4
calls_cap: 1280
online_seeds: [42, 123, 456]

# Paired Racing (shared evaluation path)
n_contenders: 6
max_pairs: 8
pair_batch_samples: 8
racing_stop_r: 0.05

# PACE_METHOD_SPEC / pace_gate1 survivor contract
epsilon: 0.0
n_min_common: 8
n_bootstrap: 200
mu: 8
archive_k: 8

lambdas: [0.25, 0.5, 0.75]
primary_lambda: 0.5
cost_norm_min: 0.0
cost_norm_max: 256.0
hv_ref_accuracy: 0.0
hv_ref_cost_norm: 1.05
w_in: 1.0
w_out: 1.0

# Survivor-only contrast (Racing evaluation for both)
methods: [b0_point_nsga, pace]
eval_policy: racing

initial_prompt_ids: [p00, p01, p02, p03, p04, p05, p07, p15]
